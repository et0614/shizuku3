;=== Shizuku3 settings ==================================
;Format: KEY=value; comment. Missing keys fall back to defaults.

;=== Execution control ==================================
ACCELERATION_RATE=0;         Initial acceleration (simulation seconds per real second. 0 = pause)
                             ;Default 0: computation starts when a client writes to AV301
TIME_STEP=1;                Calculation time step [sec] (1-60)
CONTROL_INTERVAL=300;        Minimum control update interval [sec] (not enforced by the emulator;
                             ;referenced by wrappers and GUIs)

;--- Simulation period: representative day examples -----
;Spring is set to a cool period so that the effectiveness of
;outdoor air cooling (HEX bypass) can be studied.
SIMULATION_START_DATE=2026/8/5;  Start date (YYYY/M/D) - summer representative day
;SIMULATION_START_DATE=2026/1/21; Winter representative day
;SIMULATION_START_DATE=2026/4/16; Mid-season (spring) representative day
SIMULATION_DAYS=1;           Simulation length [day]
DATA_OUTPUT_TSPAN=1;         Data output interval [min]

;=== BACnet ============================================
LOCAL_ENDPOINT=127.0.0.1;    Local endpoint IP of the emulator
DEVICE_ID=3000;              BACnet device ID
UDP_PORT=47809;              Exclusive UDP port for unicast (broadcasts are received on the
                             ;shared socket 47808. Clients should connect to 127.0.0.1:47809)

;=== Energy and comfort evaluation ======================
SYSTEM_COP_COOLING=3.5;      System COP for cooling [-]
SYSTEM_COP_HEATING=0.85;     System COP for heating [-] (hot water boiler efficiency)
PUMP_WTF=40;                 Water transport factor of the pump [-]
                             ;(= design capacity / pump power at DESIGN water flow;
                             ;used only to size the pump. The actual pump power is
                             ;proportional to the actual water FLOW - not to the
                             ;exchanged heat - so an open valve consumes pump energy
                             ;even while the AHU is off)
PMV_BIAS=0.0;                PMV bias [-] (e.g. 0.2 means PPD is minimized at PMV=+0.2)
PPD_OCCUPANT_WEIGHTED=false; Use occupant-weighted PPD integral for scoring

;=== Random stream 1: weather ===========================
WEATHER_SEED=1;              Random seed for weather (RandomWeather)
WEATHER_LOCATION=Tokyo;      Location (Tokyo/Osaka/Fukuoka/Sapporo/Sendai/Naha)

;=== Random stream 2: occupants =========================
OCCUPANT_SEED=2;             Random seed for occupants (headcount, arrival/departure, presence)
OCCUPANT_INDUSTRY=InformationAndCommunications; Industry category
                             ;(Construction/Manufacturing/Infrastructure/InformationAndCommunications/
                             ;TrafficOrPostalService/WholesaleOrRetailing/FinanceOrInsurance/RealEstate)
                             ;The number of occupants is generated stochastically from the floor
                             ;area and the industry (seed dependent; roughly 20-30 for 176.5 m2)
OCCUPANT_SHEAT_GAIN=60;      Sensible heat gain per person [W]
OCCUPANT_LHEAT_GAIN=55;      Latent heat gain per person [W]

;=== Random stream 3: water temperature (AR(1)) =========
WATER_TEMP_SEED=3;           Random seed for water temperatures
CHW_TEMP_MEAN=7.0;           Chilled water inlet temperature: mean [C]
CHW_TEMP_STDEV=1.0;          Chilled water inlet temperature: standard deviation [K] (0 = constant)
CHW_TEMP_CORR_TIME=1800;     Chilled water inlet temperature: correlation time [sec]
HW_TEMP_MEAN=44.0;           Hot water inlet temperature: mean [C]
HW_TEMP_STDEV=2.0;           Hot water inlet temperature: standard deviation [K] (0 = constant)
HW_TEMP_CORR_TIME=1800;      Hot water inlet temperature: correlation time [sec]

;=== Internal heat gains ================================
LIGHT_HEAT_GAIN=12;          Lighting heat gain [W/m2] (on while anyone is in the office)
PLUG_HEAT_GAIN_PERSON=40;    Plug load per person [W] (while present)
PLUG_HEAT_GAIN_BASE=5;       Plug standby load [W/m2] (always)
RADIATIVE_HEAT_GAIN_RATE=0.4; Radiative fraction of internal heat gains [-]

;=== CO2 ================================================
OUTDOOR_CO2_PPM=420;         Outdoor CO2 level [ppm]


;=== AHU actuator ======================================
VALVE_TRAVEL_TIME=90;        Water valve full-stroke travel time [sec]
                             ;(rate-limited electric actuator. 0 = instantaneous)

;=== Console logging ===================================
LOG_BACNET_WRITES=false;      Log every BACnet write to the console
                             ;(set false during RL training: ~200 lines/s
                             ;of console output can slow the run down)
