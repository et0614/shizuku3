# Builds the release zips, smoke-tests each on its own OS, and (for a v* tag)
# creates a DRAFT GitHub release with both zips attached.
#   git tag v0.2.1 && git push origin v0.2.1
# Review the draft on GitHub (edit the notes), then press "Publish release".
# "Run workflow" on the Actions tab builds and tests without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: python tools/make_release.py "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/*.zip
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest  # Apple Silicon runner
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5  # for tools/smoke_test.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: zips
      - name: Unzip
        run: |
          zip="zips/shizuku3-v${{ needs.build.outputs.version }}-${{ matrix.rid }}.zip"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$zip" rel  # what Finder does; keeps the executable bits
          else
            python -m zipfile -e "$zip" rel
          fi
          # relative: Git Bash's $PWD (/d/a/...) is not a path Windows Python understands
          echo "REL=./rel/shizuku3-v${{ needs.build.outputs.version }}" >> "$GITHUB_ENV"
      - name: Check executable bits (macOS)
        if: runner.os == 'macOS'
        run: test -x "$REL/Shizuku3" && test -x "$REL/setup.command"
      - run: python -m pip install "$REL/client[gui]"
      - run: python tools/smoke_test.py "$REL"

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: zips
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Shizuku3 $GITHUB_REF_NAME" --generate-notes
